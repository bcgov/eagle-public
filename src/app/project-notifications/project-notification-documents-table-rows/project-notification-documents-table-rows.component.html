<tr>
  <td data-label="Document Name" [style.background-color]="tableData.data?.rowBackgroundColor || '#F7F8FA'"><a class="d-block" [href]="documentUrl(rowData)" target="_blank" rel="noopener" (click)="trackOpen(rowData)">{{rowData.displayName}}<span class="visually-hidden"> (opens in new tab)</span></a></td>
  <td data-label="Date" (click)="goToItem(rowData)" [style.background-color]="tableData.data?.rowBackgroundColor || '#F7F8FA'">{{rowData.datePosted | date:'longDate'}}</td>
  <td data-label="Document Author" (click)="goToItem(rowData)" [style.background-color]="tableData.data?.rowBackgroundColor || '#F7F8FA'">{{idToList(rowData.documentAuthor)}}</td>
</tr>
