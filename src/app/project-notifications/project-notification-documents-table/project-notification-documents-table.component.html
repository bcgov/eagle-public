<div [style.background]="backgroundColor()" [style.--row-bg-color]="rowBackgroundColor()">
  @if (header()) {
    <div class="row mb-3 mt-2">
      <div class="col-12">
        <h4>{{header()}}</h4>
      </div>
    </div>
  }
  <lib-table-template 
    [data]="tableData()" 
    [loading]="loadingState.getOperationState('table-' + tableId())()"
    (messageOut)="onMessageOut($event)">
  </lib-table-template>
</div>
