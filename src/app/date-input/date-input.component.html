<div class="input-group" [class.is-invalid]="isValidate() && !isValidDate(dateString())">
  <input class="form-control" 
    type="date" 
    [ngModel]="dateString()" 
    (ngModelChange)="onDateChg($event)"
    [min]="minDateString()" 
    [max]="maxDateString()">
</div>
@if (isValidate() && !isValidDate(dateString())) {
  <div class="invalid-feedback bg-danger">
    Enter a valid date
  </div>
}
