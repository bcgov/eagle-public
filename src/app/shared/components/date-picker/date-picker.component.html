<div class="date-picker-container" [ngClass]="{ 'is-invalid': isValidate() && !isValidDate(dateValue()) }">
  <div class="date-input-wrapper">
    <input 
      class="date-input"
      placeholder="yyyy-mm-dd"
      name="dp"
      [ngModel]="dateValue()"
      (ngModelChange)="onDateChange($event)"
      [disabled]="isDisabled()"
      [required]="required()"
      ngbDatepicker
      #d="ngbDatepicker"
      aria-label="Date input field" />
    
    <button 
      class="icon-btn"
      (click)="d.toggle()"
      type="button"
      [disabled]="isDisabled()"
      title="Toggle calendar"
      aria-label="Toggle calendar">
      <span class="material-icons">event</span>
    </button>
    
    @if (dateValue() && !isDisabled()) {
      <button 
        class="icon-btn"
        (click)="clearDate()"
        type="button"
        title="Clear Date"
        aria-label="Clear date button">
        <span class="material-icons">close</span>
      </button>
    }
  </div>

  @if (isValidate() && !isValidDate(dateValue())) {
    <div class="invalid-feedback d-block">
      Enter a valid date
    </div>
  }
</div>
