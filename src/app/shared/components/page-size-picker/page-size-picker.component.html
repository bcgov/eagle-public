<div class="lib-page-size-display" [hidden]="isHidden()">
  @for (sizeOption of sizeOptions(); track sizeOption.value) {
    <button 
      [class.current]="isSizeOptionActive(sizeOption)"
      class="btn size-picker-option"
      (click)="sizeOptionChosen(sizeOption)"
      [disabled]="isDisabled()"
      [title]="getTitle(sizeOption)">
      {{ sizeOption.displayText }}
    </button>
  }
</div>
