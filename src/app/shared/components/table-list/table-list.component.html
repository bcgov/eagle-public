<main>
  <app-hero-banner
    [title]="config().heroBanner.title"
    [description]="config().heroBanner.description"
    [actions]="config().heroBanner.actions"
    [backgroundImage]="config().heroBanner.backgroundImage"
  />

  @if (config().tabs?.length) {
    @let tabs = config().tabs!;
    <div class="container">
      <ul class="nav nav-tabs search-tabs" role="tablist">
        @for (tab of tabs; track tab.link) {
          <li class="nav-item" role="presentation">
            <a class="nav-link"
               role="tab"
               [routerLink]="tab.link"
               routerLinkActive="active"
               [routerLinkActiveOptions]="{ exact: true }">{{ tab.label }}</a>
          </li>
        }
      </ul>
    </div>
  }

  <section class="table-container">
    <div class="container">
      <section class="mb-4 pt-0 pb-0">
        <search-filter-template
          (searchEvent)='executeSearch($event)'
          [advancedFilters]="true"
          [showAdvancedFilters]="showAdvancedFilters()"
          [searchOnFilterChange]="true"
          [filters]="filters()"
          (toggleFiltersPanelEvent)="showAdvancedFilters.set($event.showPanel)"
          [searchHelpLinkArray]='["/search-help"]'
          [searching]="loadingTableData()">
        </search-filter-template>
      </section>
      <div [class.table-loading]="loadingTableData()">
        <lib-table-template
          [data]="tableData()"
          [loading]="loadingTableData()"
          (messageOut)="onMessageOut($event)">
        </lib-table-template>
      </div>
    </div>
  </section>
</main>
