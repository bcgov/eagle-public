<app-hero-banner
  [title]="page().heroBannerTitle"
  [description]="page().heroBannerDescription"
  [actions]="page().heroBannerActions ?? []"
/>

@if (page().infoCards?.length) {
  <div class="bg-faded">
    <section class="container">
      <div class="feature-cards-container">
        @for (card of page().infoCards!; track card.title) {
          <div class="feature-card">
            <app-info-card
              [title]="card.title"
              [description]="card.description"
              [icon]="card.icon"
              [button]="card.button"
            />
          </div>
        }
      </div>
    </section>
  </div>
}

@if (page().bodyHtml) {
  <section>
    <div class="container" id="anchor-point">
      <div class="content-wrapper" [innerHTML]="page().bodyHtml! | safeHtml"></div>
    </div>
  </section>
}
