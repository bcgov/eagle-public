<tr tabindex="0"
  class="clickable-row"
  (click)="goToProject(rowData)"
  (keyup.enter)="goToProject(rowData)">
  <td data-label="Name" class="col-2">{{rowData.name || '-'}}</td>
  <td data-label="Proponent" class="col-2">{{rowData.proponent?.name || '-'}}</td>
  <td data-label="Type" class="col-2">{{rowData.type || '-'}}</td>
  <td data-label="Region" class="col-2">{{rowData.region || '-'}}</td>
  <td data-label="Phase" class="col-2">{{rowData.currentPhaseName?.name || '-'}}</td>
  <td data-label="Decision" class="col-2">{{rowData.eacDecision?.name || '-'}}</td>
</tr>
