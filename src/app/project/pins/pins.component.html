@if (loading()) {
  <div class="spinner-container">
    <div class="text-center py-4">
      <div class="spinner-border text-primary" role="status" style="width: 2rem; height: 2rem;">
        <span class="visually-hidden">Loading&hellip;</span>
      </div>
    </div>
  </div>
}

@if (tableData().totalListItems > 0) {
  <div class="fade-in mb-4">
    <h3 class="mb-4">Participating Indigenous Nations</h3>
    <lib-table-template
      [data]="tableData()"
      (messageOut)="onMessageOut($event)">
    </lib-table-template>
  </div>
}
