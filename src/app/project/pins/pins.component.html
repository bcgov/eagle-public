@if (loading()) {
  <div class="spinner-container">
    <div class="spinner-new rotating"></div>
  </div>
}

@if (tableData.totalListItems > 0) {
  <div>
    <div class="row">
      <div class="col-12">
        <h2>Participating Indigenous Nations</h2>
        <lib-table-template
          [data]="tableData"
          (messageOut)="onMessageOut($event)">
        </lib-table-template>
      </div>
    </div>
    <br />
  </div>
}
