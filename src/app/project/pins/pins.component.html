@if (loading()) {
  <div class="spinner-container">
    <div class="spinner-new rotating"></div>
  </div>
}

@if (tableData().totalListItems > 0) {
  <div class="mb-4">
    <h3 class="mb-4">Participating Indigenous Nations</h3>
    <lib-table-template
      [data]="tableData()"
      (messageOut)="onMessageOut($event)">
    </lib-table-template>
  </div>
}
