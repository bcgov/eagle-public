<div class="engage-banner">
  <div class="engage-banner__card">
    @if (cpStatus()) {
      <div class="engage-banner__status-row">
        <span class="engage-banner__status-chip engage-banner__status-chip--{{ cpStatus() | lowercase }}">{{ cpStatus() }}</span>
      </div>
    }
    @if (dateStarted() && dateCompleted()) {
      <p class="engage-banner__dates">
        <strong>Engagement dates: {{ dateStarted() | date:"MMM d, yyyy":"UTC" }} to {{ dateCompleted() | date:"MMM d, yyyy":"UTC" }}</strong>
      </p>
    }
    <a class="engage-banner__cta"
       [href]="engagementUrl()"
       target="_blank"
       rel="noopener noreferrer">
      Share your thoughts
      <i class="material-icons">open_in_new</i>
    </a>
  </div>
</div>
