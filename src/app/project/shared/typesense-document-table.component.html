<!-- Search box -->
<div class="ais-SearchBox mb-3">
  <form class="ais-SearchBox-form" novalidate (submit)="$event.preventDefault()">
    <input
      class="ais-SearchBox-input"
      type="search"
      [placeholder]="cfg.searchPlaceholder"
      [value]="keywords()"
      (input)="onTsInput($event)"
      autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
    />
    @if (keywords()) {
      <button class="ais-SearchBox-reset" type="button"
        (click)="clearTsSearch()" aria-label="Clear search">
        <i class="material-icons" aria-hidden="true" style="font-size:12px">close</i>
      </button>
    }
  </form>
</div>

<!-- Filter bar + two-column layout: viewport-fill on desktop (matches unified search) -->
<div class="search-panels">

  <!-- Filter bar: toggle button + result count -->
  <div class="filter-bar mb-3">
  <button class="filter-bar__toggle" type="button"
    (click)="toggleSidebar()"
    [attr.aria-expanded]="!sidebarCollapsed()"
    aria-controls="tsFilterSidebar">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
      fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
      <path d="M6 10.5a.5.5 0 0 1 .5-.5h3a.5.5 0 0 1 0 1h-3a.5.5 0 0 1-.5-.5zm-2-3a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7a.5.5 0 0 1-.5-.5zm-2-3a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11a.5.5 0 0 1-.5-.5z"/>
    </svg>
    {{ sidebarCollapsed() ? 'Open Filters' : 'Close Filters' }}
    @if (activeFilterCount() > 0) {
      <span class="filter-sidebar__badge">{{ activeFilterCount() }}</span>
    }
  </button>
  @if (engine() && engine()!.nbHits() > 0 && !engine()!.isLoading()) {
    <span class="text-muted small ms-auto">
      {{ engine()!.nbHits().toLocaleString() }} result{{ engine()!.nbHits() === 1 ? '' : 's' }}{{ engine()!.procMs() ? ' in ' + engine()!.procMs() + ' ms' : '' }}
    </span>
  }
</div>

<!-- Two-column layout: sidebar + results -->
<div class="search-columns">

  @if (engine(); as eng) {

    <!-- Filter sidebar -->
    <app-search-filter-sidebar
      sidebarId="tsFilterSidebar"
      [ariaLabel]="cfg.filterAriaLabel"
      [facets]="cfg.facets"
      [facetSnapshot]="facetSnapshot()"
      [groupedSnapshot]="groupedSnapshot()"
      [filtersLoaded]="eng.filtersLoaded()"
      [sidebarCollapsed]="sidebarCollapsed()"
      [filtersOpen]="filtersOpen()"
      [collapsedFacets]="collapsedFacets()"
      [dateFacet]="$any(docDateFacet)"
      [fromCtrl]="eng.fromCtrl"
      [toCtrl]="eng.toCtrl"
      [hasDateFilter]="eng.hasDateFilter()"
      [activeFilterCount]="activeFilterCount()"
      (toggleSidebar)="toggleSidebar()"
      (toggleFiltersOpen)="filtersOpen.set(!filtersOpen())"
      (toggleFacet)="toggleFacet($event)"
      (refineFacet)="eng.refine($event.attribute, $event.value)"
      (clearDateFilter)="eng.clearDateFilter()" />

    <!-- Results column -->
    <div class="results-col" #tsResultsCol>
      <app-search-results-list
        collectionId="documents"
        [hits]="eng.hits()"
        [isLoading]="eng.isLoading()"
        [isLoadingMore]="eng.isLoadingMore()"
        [hasSearched]="eng.hasSearched()"
        [hasError]="eng.hasError()"
        [emptyMessage]="cfg.emptyMessage"
        [showProjectLink]="false"
        (downloadClicked)="onDownloadClicked($event)" />
      <div #tsSentinel></div>
    </div>

  }

</div><!-- /.search-columns -->

</div><!-- /.search-panels -->
