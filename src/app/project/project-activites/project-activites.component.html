<h3 #activitiesHeader class="mb-4">Activities and Updates</h3>

<search-filter-template
  #explorePanel
  [keywordOverride]='queryParams["keywordsActivities"]'
  (searchEvent)='executeSearch($event)'>
</search-filter-template>

<section class="tab-section">
  @if (tableData().totalListItems === 0 && !loading()) {
    <div>
      No recent activities.
    </div>
  } @else {
    <lib-table-template
      [data]="tableData()"
      [loading]="loading()"
      (messageOut)="onMessageOut($event)">
    </lib-table-template>
  }
</section>
