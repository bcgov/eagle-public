<td data-label="Name"
  class="col-3">
  <a [href]="documentUrl(rowData)" (click)="trackDownload(rowData)">{{rowData.displayName}}<span class="visually-hidden"> (download)</span></a>
</td>
<td data-label="ProjectName"
  class="col-2">
  <a
    [attr.aria-label]="'Link to project ' + rowData.project.name"
    [routerLink]="['/p', rowData.project._id, 'project-details']"
    tabindex="0">{{rowData.project.name}}</a>
</td>
<td data-label="Date"
  class="col-2">
  @if (rowData.datePosted !== '1900-01-01T08:00:00.000Z') {
    <div>{{rowData.datePosted | date:'longDate'}}</div>
  }
</td>
<td data-label="Type"
  class="col-2">{{idToList(rowData.type)}}</td>
<td data-label="Milestone"
  class="col-2">{{idToList(rowData.milestone)}}</td>
<td data-label="Download"
  class="col-1 d-flex justify-content-center">
  <a class="material-icons download-icon"
    [href]="documentUrl(rowData)"
    (click)="trackDownload(rowData)"
    tabindex="-1"
    aria-hidden="true">cloud_download</a>
</td>
