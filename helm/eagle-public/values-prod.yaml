# Production environment values
replicaCount: 3

image:
  tag: "prod"

route:
  # Disabled, and it must stay that way until the certificate question is settled. `prod-external`
  # already serves this host through rproxy AND carries the Entrust certificate for it; the route
  # this chart renders has no `tls.certificate` at all, so a second route for the same host with
  # `path: /` — which matches every request — risks the public site being served the router's
  # default certificate instead. Enabling it (6b929939) is fine in dev and test, where the host is
  # an *.apps.silver hostname covered by the router's wildcard, and wrong here.
  #
  # `host` is deliberately NOT set here either. Leaving it behind would mean flipping `enabled`
  # back to true silently re-creates a route for projects.eao.gov.bc.ca with no certificate — the
  # exact failure this removes. Re-enabling must be a deliberate act that also supplies a host and
  # a cert.
  enabled: false

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 512Mi

# Pod Disruption Budget - ensure at least 1 pod during disruptions
podDisruptionBudget:
  enabled: true
  minAvailable: 1

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
