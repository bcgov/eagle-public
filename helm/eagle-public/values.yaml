# Default values for eagle-public
# Override in values-{env}.yaml for environment-specific settings

replicaCount: 1

image:
  repository: image-registry.openshift-image-registry.svc:5000/6cdc9e-tools/eagle-public
  pullPolicy: Always
  tag: "latest"
  # For OpenShift ImageStreamTag trigger
  name: eagle-public
  namespace: 6cdc9e-tools

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8080

route:
  enabled: true
  host: ""  # Set in values-{env}.yaml
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 128Mi

# Liveness and readiness probes
probes:
  liveness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 3
  readiness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3

# Backend service names (for nginx proxy_pass)
backend:
  eagleApi: eagle-api
  eagleApiPort: 3000
  penguinAnalytics: penguin-analytics-api
  penguinAnalyticsPort: 3000

# Environment variables passed to the container (optional overrides)
env: {}

# Pod annotations
podAnnotations: {}

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity rules
affinity: {}

# Autoscaling (disabled by default)
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

# Pod Disruption Budget for zero-downtime deployments
podDisruptionBudget:
  enabled: false
  minAvailable: 1
