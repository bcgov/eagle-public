name: Preview Branch in Test

on:
  push:
    branches:
      - 'hotfix/**'
      - 'feat/**'
      - 'feature/**'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to preview (e.g. hotfix/pcp-engage)'
        required: true
        type: string
      skip_scan:
        description: 'Skip Trivy scan'
        required: false
        type: boolean
        default: false

permissions: write-all

env:
  OPENSHIFT_NAMESPACE_TOOLS: 6cdc9e-tools
  OPENSHIFT_NAMESPACE_TEST: 6cdc9e-test
  IMAGE_NAME: eagle-public

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.vars.outputs.branch }}
      slug: ${{ steps.vars.outputs.slug }}
      release_name: ${{ steps.vars.outputs.release_name }}
      preview_host: ${{ steps.vars.outputs.preview_host }}
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - name: Resolve branch and slug
        id: vars
        run: |
          # For push events use the ref; for workflow_dispatch use the input
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BRANCH="${{ inputs.branch }}"
          else
            BRANCH="${{ github.ref_name }}"
          fi
          SLUG=$(echo "${BRANCH}" | sed 's|/|-|g' | sed 's|[^a-zA-Z0-9-]|-|g' | tr '[:upper:]' '[:lower:]' | cut -c1-40)
          RELEASE_NAME="eagle-public-${SLUG}"
          PREVIEW_HOST="${SLUG}.test.projects.eao.gov.bc.ca"
          IMAGE_TAG="preview-${SLUG}"
          echo "branch=${BRANCH}"       >> $GITHUB_OUTPUT
          echo "slug=${SLUG}"           >> $GITHUB_OUTPUT
          echo "release_name=${RELEASE_NAME}" >> $GITHUB_OUTPUT
          echo "preview_host=${PREVIEW_HOST}" >> $GITHUB_OUTPUT
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "## Branch Preview" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${BRANCH}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Helm Release** | \`${RELEASE_NAME}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Preview URL** | https://${PREVIEW_HOST} |" >> $GITHUB_STEP_SUMMARY

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.branch }}
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: yarn
      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn build

  scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [prepare, build]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_scan == false }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.branch }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: ${{ env.IMAGE_NAME }}:scan-${{ needs.prepare.outputs.slug }}
          load: true
      - uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:scan-${{ needs.prepare.outputs.slug }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  push:
    name: Push Image
    runs-on: ubuntu-latest
    needs: [prepare, build, scan]
    if: always() && needs.build.result == 'success' && (needs.scan.result == 'success' || needs.scan.result == 'skipped')
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.branch }}
      - uses: docker/login-action@v4
        with:
          registry: ${{ secrets.OPENSHIFT_REPOSITORY }}
          username: ${{ secrets.OPENSHIFT_REPOSITORY_USERNAME }}
          password: ${{ secrets.OPENSHIFT_REPOSITORY_PASSWORD }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ secrets.OPENSHIFT_REPOSITORY }}/${{ env.OPENSHIFT_NAMESPACE_TOOLS }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.image_tag }}

  deploy:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: [prepare, push]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.branch }}
      - name: Install oc
        run: |
          curl -LO "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/latest/openshift-client-linux.tar.gz"
          tar -xzf openshift-client-linux.tar.gz && sudo mv oc /usr/local/bin/
      - name: Install Helm
        run: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      - name: Login to OpenShift
        run: oc login --server=${{ secrets.OPENSHIFT_URL }} --token=${{ secrets.OPENSHIFT_TOKEN }}
      - name: Helm deploy (isolated release)
        run: |
          helm upgrade --install ${{ needs.prepare.outputs.release_name }} ./helm/eagle-public \
            --namespace ${{ env.OPENSHIFT_NAMESPACE_TEST }} \
            --values ./helm/eagle-public/values-test.yaml \
            --set image.tag=${{ needs.prepare.outputs.image_tag }} \
            --set fullnameOverride=${{ needs.prepare.outputs.release_name }} \
            --set route.serviceName=${{ needs.prepare.outputs.release_name }} \
            --set route.targetPort=http \
            --set route.host="" \
            --set replicaCount=1 \
            --wait --timeout=5m
      - name: Verify rollout
        run: |
          oc rollout status deployment/${{ needs.prepare.outputs.release_name }} \
            -n ${{ env.OPENSHIFT_NAMESPACE_TEST }} --timeout=5m
          ROUTE_HOST=$(oc get route ${{ needs.prepare.outputs.release_name }} \
            -n ${{ env.OPENSHIFT_NAMESPACE_TEST }} \
            -o jsonpath='{.spec.host}' 2>/dev/null || echo 'unknown')
          echo "## Preview Ready" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://${ROUTE_HOST}" >> $GITHUB_STEP_SUMMARY
          echo "> Teardown: run **Teardown Branch Preview** workflow with branch \`${{ needs.prepare.outputs.branch }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Preview URL: https://${ROUTE_HOST}"
