name: Deploy to Test

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.2.3)'
        required: true
        type: string

permissions: write-all

env:
  OPENSHIFT_NAMESPACE_TOOLS: 6cdc9e-tools
  OPENSHIFT_NAMESPACE_TEST: 6cdc9e-test
  IMAGE_NAME: eagle-public
  APP_NAME: eagle-public

jobs:
  validate:
    name: Validate Version
    runs-on: ubuntu-latest
    outputs:
      tag_exists: ${{ steps.check-tag.outputs.exists }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate version format
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Version must be in format v1.2.3"
            exit 1
          fi

      - name: Check if tag exists
        id: check-tag
        run: |
          if git rev-parse "${{ inputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag ${{ inputs.version }} already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag ${{ inputs.version }} does not exist - will create"
          fi

  release:
    name: Create Release
    needs: validate
    if: needs.validate.outputs.tag_exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create Git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ inputs.version }}" -m "Release ${{ inputs.version }}"
          git push origin "${{ inputs.version }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ inputs.version }}" \
            --title "Release ${{ inputs.version }}" \
            --generate-notes

  deploy:
    name: Deploying ${{ inputs.version }} to Test
    needs: [validate, release]
    if: always() && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository at version tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.version }}

      - name: Install OpenShift CLI
        run: |
          curl -LO "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/latest/openshift-client-linux.tar.gz"
          tar -xvzf openshift-client-linux.tar.gz
          sudo mv oc /usr/local/bin/
          rm -f openshift-client-linux.tar.gz

      - name: Log into OpenShift
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: ${{ secrets.OPENSHIFT_URL }}
          openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
          insecure_skip_tls_verify: true
          namespace: ${{ env.OPENSHIFT_NAMESPACE_TEST }}

      - name: Check if image exists and tag if needed
        run: |
          if oc -n ${{ env.OPENSHIFT_NAMESPACE_TOOLS }} get imagestreamtag ${{ env.IMAGE_NAME }}:${{ inputs.version }} &>/dev/null; then
            echo "Image tag ${{ inputs.version }} already exists - using existing image"
            
            # Verify existing tag is healthy
            STATUS=$(oc get imagestreamtag ${{ env.IMAGE_NAME }}:${{ inputs.version }} -n ${{ env.OPENSHIFT_NAMESPACE_TOOLS }} -o jsonpath='{.conditions[?(@.type=="ImportSuccess")].status}' 2>/dev/null || echo "Unknown")
            MESSAGE=$(oc get imagestreamtag ${{ env.IMAGE_NAME }}:${{ inputs.version }} -n ${{ env.OPENSHIFT_NAMESPACE_TOOLS }} -o jsonpath='{.conditions[?(@.type=="ImportSuccess")].message}' 2>/dev/null || echo "")
            if [ "$STATUS" = "False" ]; then
              echo "❌ Image tag ${{ inputs.version }} is in a failed import state: $MESSAGE"
              exit 1
            fi
          else
            echo "Image tag ${{ inputs.version }} does not exist - tagging from ci-latest"
            
            # Verify ci-latest is healthy before tagging
            STATUS=$(oc get imagestreamtag ${{ env.IMAGE_NAME }}:ci-latest -n ${{ env.OPENSHIFT_NAMESPACE_TOOLS }} -o jsonpath='{.conditions[?(@.type=="ImportSuccess")].status}' 2>/dev/null || echo "Unknown")
            MESSAGE=$(oc get imagestreamtag ${{ env.IMAGE_NAME }}:ci-latest -n ${{ env.OPENSHIFT_NAMESPACE_TOOLS }} -o jsonpath='{.conditions[?(@.type=="ImportSuccess")].message}' 2>/dev/null || echo "")
            if [ "$STATUS" = "False" ]; then
              echo "❌ Cannot tag from ci-latest: import is in a failed state: $MESSAGE"
              exit 1
            fi

            oc -n ${{ env.OPENSHIFT_NAMESPACE_TOOLS }} tag \
              ${{ env.IMAGE_NAME }}:ci-latest ${{ env.IMAGE_NAME }}:${{ inputs.version }}
          fi

      - name: Tag version as test
        run: |
          echo "Tagging ${{ inputs.version }} as test..."
          oc -n ${{ env.OPENSHIFT_NAMESPACE_TOOLS }} tag \
            ${{ env.IMAGE_NAME }}:${{ inputs.version }} ${{ env.IMAGE_NAME }}:test

      - name: Install Helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm version

      - name: Deploy with Helm
        run: |
          helm upgrade --install ${{ env.APP_NAME }} ./helm/${{ env.APP_NAME }} \
            --namespace ${{ env.OPENSHIFT_NAMESPACE_TEST }} \
            --values ./helm/${{ env.APP_NAME }}/values-test.yaml \
            --set image.tag=test \
            --wait --timeout=5m

      - name: Verify deployment
        run: |
          echo "Deployment successful!"
          oc get pods -n ${{ env.OPENSHIFT_NAMESPACE_TEST }} -l app.kubernetes.io/name=${{ env.APP_NAME }}
