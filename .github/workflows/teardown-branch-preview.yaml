name: Teardown Branch Preview

on:
  delete:
    branches:
      - 'hotfix/**'
      - 'feat/**'
      - 'feature/**'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to tear down (e.g. hotfix/pcp-engage)'
        required: true
        type: string

permissions: write-all

env:
  OPENSHIFT_NAMESPACE_TOOLS: 6cdc9e-tools
  OPENSHIFT_NAMESPACE_TEST: 6cdc9e-test
  IMAGE_NAME: eagle-public

jobs:
  teardown:
    name: Teardown Preview
    runs-on: ubuntu-latest
    steps:
      - name: Resolve branch slug
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BRANCH="${{ inputs.branch }}"
          else
            BRANCH="${{ github.event.ref }}"
          fi
          SLUG=$(echo "${BRANCH}" | sed 's|/|-|g' | sed 's|[^a-zA-Z0-9-]|-|g' | tr '[:upper:]' '[:lower:]' | cut -c1-40)
          echo "release_name=eagle-public-${SLUG}" >> $GITHUB_OUTPUT
          echo "image_tag=preview-${SLUG}"         >> $GITHUB_OUTPUT
          echo "branch=${BRANCH}"                  >> $GITHUB_OUTPUT

      - name: Install oc
        run: |
          curl -LO "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/latest/openshift-client-linux.tar.gz"
          tar -xzf openshift-client-linux.tar.gz && sudo mv oc /usr/local/bin/

      - name: Install Helm
        run: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Login to OpenShift
        run: |
          for i in {1..10}; do
            echo "Attempt $i: Logging into OpenShift..."
            oc login --server=${{ secrets.OPENSHIFT_URL }} --token=${{ secrets.OPENSHIFT_TOKEN }} --insecure-skip-tls-verify=true && oc project ${{ env.OPENSHIFT_NAMESPACE_TEST }} && echo "✓ Successfully logged in!" && exit 0 || {
              echo "Attempt $i failed. Retrying in 15 seconds..."
              sleep 15
            }
          done
          echo "❌ Failed to log into OpenShift after 10 attempts."
          exit 1


      - name: Helm uninstall
        run: |
          if helm status ${{ steps.vars.outputs.release_name }} -n ${{ env.OPENSHIFT_NAMESPACE_TEST }} > /dev/null 2>&1; then
            helm uninstall ${{ steps.vars.outputs.release_name }} -n ${{ env.OPENSHIFT_NAMESPACE_TEST }}
            echo "Removed release ${{ steps.vars.outputs.release_name }}"
          else
            echo "Release not found — already cleaned up."
          fi

      - name: Remove image tag
        run: |
          if oc -n ${{ env.OPENSHIFT_NAMESPACE_TOOLS }} get imagestreamtag \
              ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.image_tag }} &>/dev/null; then
            oc -n ${{ env.OPENSHIFT_NAMESPACE_TOOLS }} tag --delete \
              ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.image_tag }}
          fi

      - name: Summary
        run: |
          echo "## Teardown Complete" >> $GITHUB_STEP_SUMMARY
          echo "Preview for \`${{ steps.vars.outputs.branch }}\` removed from \`${{ env.OPENSHIFT_NAMESPACE_TEST }}\`." >> $GITHUB_STEP_SUMMARY
