# Build a release tag and publish it to the staging `$web` storage container, served
# through the shared Front Door profile. Staging is spelled `-test` in Azure.
name: Deploy eagle-public to Azure staging

# TAG-DRIVEN. The deploy source is a release tag, never a branch, so test always serves a
# frontend some release produced. Cut the tag with `release.yaml` first.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v2.7.28 or v3.0.0-beta.1)'
        required: true
        type: string
      target:
        description: 'test = test.projects.eao.gov.bc.ca (release line); next = the eagle-public-next endpoint (next line, pre-release tags)'
        required: true
        type: choice
        default: test
        options: [test, next]

concurrency:
  group: deploy-azure-staging-${{ inputs.target }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build & deploy Azure preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The environment name is the OIDC subject claim on the federated credential;
    # rename it and Azure Login fails with AADSTS700213.
    environment: ${{ inputs.target == 'next' && 'azure-next' || 'azure-test' }}
    env:
      # `<name>-<hash>.z01.azurefd.net`: the hash is assigned at deploy time, so set this
      # repository variable from the Front Door bicep output rather than guessing it.
      AFD_ENDPOINT: ${{ vars.AZURE_FRONTDOOR_ENDPOINT }}
      STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # The tag, not the default branch.
          ref: ${{ inputs.version }}

      # An empty storage account uploads nowhere and an empty endpoint smoke-tests
      # `https:///`, so both fail here rather than late in the run.
      - name: Verify the deployment targets are configured
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # `checkout` accepts any ref, so this is what keeps a branch tip off test.
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]] \
            || { echo "::error::version '$VERSION' is not a release tag of the form v1.2.3 or v1.2.3-beta.4 — the deploy source is a TAG, never a branch"; exit 1; }
          git fetch --tags --quiet origin
          git rev-parse -q --verify "refs/tags/$VERSION^{commit}" >/dev/null \
            || { echo "::error::tag $VERSION does not exist in this repository — cut it with the release workflow first"; exit 1; }

          [ -n "$STORAGE_ACCOUNT" ] \
            || { echo "::error::repository variable AZURE_STORAGE_ACCOUNT is empty"; exit 1; }
          [ -n "$AFD_ENDPOINT" ] \
            || { echo "::error::repository variable AZURE_FRONTDOOR_ENDPOINT is empty — set it from the Front Door deployment output, the hostname hash is not predictable"; exit 1; }

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test

      # The committed `src/env.js` stays relative; the per-environment values are applied
      # here at build time. `sed` exits 0 on no match, so each rewrite is verified below.
      - name: Point env.js at the same-origin test runtime
        run: |
          set -euo pipefail
          # Same-origin, as prod: rproxy serves this bundle on test.projects.eao.gov.bc.ca, so
          # paths stay relative and `configEndpoint` true — /api/config supplies the rest.
          sed -i "s|window.__env.configEndpoint = .*|window.__env.configEndpoint = true;|" src/env.js
          sed -i "s|window.__env.API_LOCATION = .*|window.__env.API_LOCATION = null;|" src/env.js
          sed -i "s|window.__env.logLevel = .*|window.__env.logLevel = 4;|" src/env.js
          sed -i "s|window.__env.ANALYTICS_DEBUG = .*|window.__env.ANALYTICS_DEBUG = false;|" src/env.js
          # Belt and braces: if /api/config cannot answer, whatever ships is what the page uses.
          sed -i "s|window.__env.ENVIRONMENT = .*|window.__env.ENVIRONMENT = 'test';|" src/env.js
          sed -i "s|window.__env.ADMIN_PATH = .*|window.__env.ADMIN_PATH = '/admin/';|" src/env.js
          # Absolute because eagle-notify is a different origin with no rproxy location, and
          # /api/config does not serve NOTIFY_API. Both staging targets use the test notify API.
          sed -i "s|window.__env.NOTIFY_API = .*|window.__env.NOTIFY_API = 'https://notify-api-test.azurewebsites.net';|" src/env.js
          for expected in \
            "window.__env.configEndpoint = true;" \
            "window.__env.API_LOCATION = null;" \
            "window.__env.logLevel = 4;" \
            "window.__env.ANALYTICS_DEBUG = false;" \
            "window.__env.ENVIRONMENT = 'test';" \
            "window.__env.ADMIN_PATH = '/admin/';" \
            "window.__env.NOTIFY_API = 'https://notify-api-test.azurewebsites.net';"; do
            grep -qF "$expected" src/env.js \
              || { echo "::error::env.js rewrite did not take: $expected"; exit 1; }
          done
          # The other half of the contract: the paths that must NOT have been touched.
          for relative in \
            "window.__env.API_PATH = '/api';" \
            "window.__env.ANALYTICS_API_URL = '/analytics';" \
            "window.__env.SEARCH_API_PATH = '';"; do
            grep -qF "$relative" src/env.js \
              || { echo "::error::env.js no longer holds the same-origin default: $relative — the test bundle must stay relative"; exit 1; }
          done
          grep -n 'window.__env' src/env.js

      - name: Build
        run: yarn build

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # `staticWebsite` is a data-plane property, so no Bicep can set it or create `$web`.
      # Needs Storage Account Contributor, not just Storage Blob Data Contributor.
      - name: Enable static website hosting on $web
        run: |
          set -euo pipefail
          az storage blob service-properties update --account-name "$STORAGE_ACCOUNT" \
            --auth-mode login --static-website --index-document index.html \
            --404-document index.html --output none
          echo "static website hosting enabled on $STORAGE_ACCOUNT"

      # `$web` sets no headers, so Cache-Control is written per blob at upload time. One
      # batch per rule, so the patterns must be exhaustive and non-overlapping.
      - name: Publish the bundle to $web
        run: |
          set -euo pipefail
          src=dist/eagle-public/browser
          nostore='no-cache, no-store, must-revalidate'
          immutable='public, max-age=31536000, immutable'

          # env.js leaves the tree first: not content-hashed, must never be cached, and the
          # `*.js` batch would otherwise catch it.
          mv "$src/env.js" ./env.js.deploy

          # Nothing under `assets/` is content-hashed, so it uploads `no-cache` on its own and
          # then leaves the tree, which makes every remaining `.js`/`.css` genuinely hashed.
          az storage blob upload-batch --account-name "$STORAGE_ACCOUNT" --auth-mode login \
            -d '$web' -s "$src" --pattern 'assets/*' --overwrite \
            --content-cache-control 'no-cache' --output none
          rm -rf "$src/assets"

          # Left at the root: the hashed bundles, plus unhashed files like favicon.ico that
          # fall through to the `no-cache` catch-all below.
          hashed='js css'
          # Every pattern ends in `.<ext>`, so an extensionless file would upload uncached.
          noext=$(cd "$src" && find . -type f ! -name '*.*')
          [ -z "$noext" ] \
            || { echo "::error::no --pattern can match these extensionless files, they would ship uncached: $noext"; exit 1; }

          for ext in $hashed; do
            az storage blob upload-batch --account-name "$STORAGE_ACCOUNT" --auth-mode login \
              -d '$web' -s "$src" --pattern "*.$ext" --overwrite \
              --content-cache-control "$immutable" --output none
          done

          for pattern in '*.html' '*.json'; do
            az storage blob upload-batch --account-name "$STORAGE_ACCOUNT" --auth-mode login \
              -d '$web' -s "$src" --pattern "$pattern" --overwrite \
              --content-cache-control "$nostore" --output none
          done

          # Whatever neither rule names gets `no-cache`. The extension list comes from the build
          # output, so a new file type cannot ship with no Cache-Control at all.
          rest=$(cd "$src" && find . -type f -name '*.*' | sed 's|.*\.||' | sort -u \
            | grep -vxE "$(echo $hashed html json | tr ' ' '|')" || true)
          for ext in $rest; do
            az storage blob upload-batch --account-name "$STORAGE_ACCOUNT" --auth-mode login \
              -d '$web' -s "$src" --pattern "*.$ext" --overwrite \
              --content-cache-control 'no-cache' --output none
          done

          # Last and alone: a stale env.js points the whole app at the wrong API. Content-type
          # is explicit because the file on disk has a different name.
          az storage blob upload --account-name "$STORAGE_ACCOUNT" --auth-mode login \
            -c '$web' -n env.js -f ./env.js.deploy --overwrite \
            --content-cache-control "$nostore" --content-type 'text/javascript; charset=utf-8' \
            --output none

          echo "published to $STORAGE_ACCOUNT/\$web"

      # Asserts what Front Door supplies and `$web` cannot: the six security headers, the SPA
      # rewrite on a deep link, and the per-blob Cache-Control. Retries while the route spreads.
      - name: Smoke test
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -uo pipefail
          host="https://$AFD_ENDPOINT"
          for i in $(seq 1 30); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$host/")" = "200" ] && break
            echo "attempt $i: $host/ not ready yet"; sleep 10
          done

          root=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$host/")
          [ "$root" = "200" ] || { echo "::error::/ returned $root, expected 200"; exit 1; }

          headers=$(curl -s -I --max-time 15 "$host/")
          for header in content-security-policy strict-transport-security x-content-type-options \
                        x-frame-options referrer-policy permissions-policy; do
            echo "$headers" | grep -qi "^$header:" \
              || { echo "::error::$host/ is missing the $header header — check the Front Door rule set"; exit 1; }
          done

          # Presence is not enough: a CSP that omits an origin index.html loads white-screens
          # the page. The origin list comes from the deployed page, not a hardcoded list.
          csp=$(echo "$headers" | grep -i '^content-security-policy:')
          for origin in $(curl -s --max-time 15 "$host/" \
            | grep -oE '(src|href)="https://[^/"]+' | grep -oE 'https://[^/"]+' | sort -u); do
            echo "$csp" | grep -qF "$origin" \
              || { echo "::error::the CSP does not name $origin, which index.html loads — the page will white-screen"; exit 1; }
          done
          # Search is same-origin through rproxy now, so no host is named; the guard below is
          # about what the policy must NOT permit.
          echo "$csp" | grep -qF '*.azurewebsites.net' \
            && { echo "::error::the CSP wildcards *.azurewebsites.net — name a host exactly or, better, do not name one at all now that search is same-origin"; exit 1; }

          deep=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$host/projects/deadbeef")
          [ "$deep" = "200" ] || { echo "::error::/projects/deadbeef returned $deep, expected 200 — the SPA rewrite rule is not working, every deep link is broken"; exit 1; }

          # From the deployed index.html, so it also proves the bundle this page asks for is
          # the one that was uploaded.
          asset=$(curl -s --max-time 15 "$host/" | grep -o 'main-[A-Za-z0-9_-]*\.js' | head -1)
          [ -n "$asset" ] || { echo "::error::no hashed main bundle referenced by the deployed index.html"; exit 1; }

          # And that it is THIS build's bundle: without it every assertion above is satisfied by
          # the previous deploy. The path is spelled out because each `run:` is its own shell.
          built=$(ls dist/eagle-public/browser/main-*.js 2>/dev/null | head -1); built=${built##*/}
          [ -n "$built" ] || { echo "::error::no hashed main bundle in the build output — cannot prove the deploy is this build"; exit 1; }
          [ "$asset" = "$built" ] \
            || { echo "::error::the site serves $asset but this build produced $built — the upload did not take, or Front Door is serving a cached page from the previous deploy"; exit 1; }
          curl -s -I --max-time 15 "$host/$asset" | grep -qi '^cache-control:.*immutable' \
            || { echo "::error::$asset is not cached immutable"; exit 1; }

          curl -s -I --max-time 15 "$host/env.js" | grep -qi '^cache-control:.*no-store' \
            || { echo "::error::env.js is cacheable — a stale copy points the app at the wrong API"; exit 1; }

          # The deployed env.js is the test one and still same-origin: catches a skipped rewrite
          # step, and the day someone copies an absolute hostname back in.
          deployed_env=$(curl -s --max-time 15 "$host/env.js")
          echo "$deployed_env" | grep -qF 'window.__env.configEndpoint = true;' \
            || { echo "::error::the deployed env.js still has configEndpoint = false — it will never fetch /api/config and will serve the committed dev defaults"; exit 1; }
          echo "$deployed_env" | grep -qF "window.__env.API_PATH = '/api';" \
            || { echo "::error::the deployed env.js does not use the relative /api path — the test bundle must stay same-origin"; exit 1; }
          echo "$deployed_env" | grep -qF "window.__env.SEARCH_API_PATH = '';" \
            || { echo "::error::the deployed env.js bakes an absolute SEARCH_API_PATH — rproxy serves /eagle-search and /demi-search same-origin, and /api/config supplies the value at runtime"; exit 1; }
          echo "$deployed_env" | grep -qF "window.__env.ENVIRONMENT = 'test';" \
            || { echo "::error::the deployed env.js does not announce the test environment — the banner would be wrong"; exit 1; }

          echo "deployed and correctly cached."
          if [ "$TARGET" = "next" ]; then
            echo "NOTE: this endpoint has the test /api behind it (eagle-edge gives the next site a backend route),"
            echo "so it is the site to share for review. It shows test data."
          else
            echo "NOTE: this raw Front Door hostname has no /api behind it —"
            echo "the working site is the one rproxy serves, where the same bundle is same-origin."
          fi

      - name: Report failure to job summary
        if: failure()
        run: |
          echo "### ❌ Azure preview deploy failed" >> $GITHUB_STEP_SUMMARY
          echo "If the security headers or the deep-link rewrite are missing, the Front Door rule set is not attached to this route." >> $GITHUB_STEP_SUMMARY
          echo "This is the TEST estate: re-apply it from eagle-edge's \`azure/modules/front-door.bicep\`; the storage account and its \`\$web\` container come from its \`azure/modules/static-site.bicep\`." >> $GITHUB_STEP_SUMMARY
