# =============================================================================
# Deploy the eagle-public Azure preview to staging
# =============================================================================
# Builds this branch and ships it to the Azure App Service `eagle-public-preview-test`.
#
# THIS IS A SEPARATE PIPELINE, NOT A REPLACEMENT. `deploy-to-dev.yaml`,
# `deploy-to-test.yaml`, `deploy-to-prod.yaml`, `preview-branch-in-test.yaml` and
# `teardown-branch-preview.yaml` are untouched and still own OpenShift. This workflow
# is a different branch, a different platform and a different credential, and the two
# never meet. The full OpenShift-to-Azure switchover is a later decision.
#
# It lives only on `azure-search-preview` and triggers only on that branch, which is
# deliberately outside `preview-branch-in-test.yaml`'s `feat/**|feature/**|hotfix/**`
# patterns — so pushing here cannot also spin up an OpenShift branch preview.
#
# Staging is spelled `-test` in Azure: the App Service, the search API and the
# resource group all live in the `c4b0a8-test` subscription. The GitHub environment
# here is `azure-test` rather than `test` so it can never be confused with the
# OpenShift pipeline in this same repository.
#
# Application only — never infrastructure. `eagle-public-cicd-test` holds Website
# Contributor on this one web app and nothing at resource-group scope. The Bicep that
# describes the app lives in `digitalspace/eagle-search`, not here.
# =============================================================================

name: Deploy eagle-public to Azure staging

on:
  push:
    branches:
      - azure-search-preview
  workflow_dispatch:

concurrency:
  group: deploy-azure-staging
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build & deploy Azure preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Declaring an environment CHANGES THE OIDC SUBJECT CLAIM — it becomes
    # `repo:bcgov/eagle-public:environment:azure-test`, which is the subject on the
    # federated credential of `eagle-public-cicd-test`. Rename this environment, or
    # drop the line, and Azure Login fails with AADSTS700213.
    environment: azure-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: |
          corepack enable
          yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test

      # The static server has its own self-check and it is the cheapest regression net
      # available for this deployment: it asserts every security header the OpenShift
      # nginx sets is present, that the CSP names `eagle-search-api-test` WITHOUT
      # wildcarding `*.azurewebsites.net`, that the CSP covers every external origin
      # `src/index.html` actually loads (a missing one white-screens the SPA with
      # nothing but a console violation), that deep links fall back to index.html, that
      # percent-encoded traversal is refused, and that the basic-auth gate 401s.
      - name: Check the static server
        run: node azure/server.check.js

      # ---------------------------------------------------------------------------
      # Point env.js at Azure.
      #
      # The committed `src/env.js` is the RELATIVE, merge-safe one — `API_PATH = '/api'`,
      # `SEARCH_API_PATH = ''` — and it is byte-identical to the copy on `develop`. That
      # is deliberate (`076bc94d chore: make env.js safe to merge`) and must stay that
      # way, because an absolute env.js reaching an OpenShift image would point every
      # environment at test.
      #
      # So the Azure values are applied here instead, at build time. This is the same
      # thing the Dockerfile already does for the OpenShift image (`Dockerfile:34-37`
      # seds `configEndpoint`, `API_LOCATION`, `logLevel` and `ANALYTICS_DEBUG`) — the
      # pattern is the repo's, not a new invention.
      #
      # Absolute because there is no rproxy in front of the Azure host and no
      # `/api/config` to fetch: `configEndpoint` stays false and every value below has
      # to name a host. `API_LOCATION` and `ADMIN_PATH` are already absolute in the
      # committed file, so exactly three values change.
      #
      # `sed` exits 0 when it matches nothing, so each rewrite is verified. Without the
      # check a renamed key ships a bundle that silently calls the static server for
      # its API and 404s on everything, and the build stays green.
      # ---------------------------------------------------------------------------
      - name: Point env.js at Azure
        run: |
          set -euo pipefail
          sed -i "s|window.__env.API_PATH = .*|window.__env.API_PATH = 'https://eagle-test.apps.silver.devops.gov.bc.ca/api';|" src/env.js
          sed -i "s|window.__env.SEARCH_API_PATH = .*|window.__env.SEARCH_API_PATH = 'https://eagle-search-api-test.azurewebsites.net/api';|" src/env.js
          sed -i "s|window.__env.ANALYTICS_API_URL = .*|window.__env.ANALYTICS_API_URL = 'https://eagle-test.apps.silver.devops.gov.bc.ca/analytics';|" src/env.js
          for expected in \
            "API_PATH = 'https://eagle-test.apps.silver.devops.gov.bc.ca/api'" \
            "SEARCH_API_PATH = 'https://eagle-search-api-test.azurewebsites.net/api'" \
            "ANALYTICS_API_URL = 'https://eagle-test.apps.silver.devops.gov.bc.ca/analytics'"; do
            grep -qF "$expected" src/env.js \
              || { echo "::error::env.js rewrite did not take: $expected"; exit 1; }
          done
          grep -n 'window.__env' src/env.js

      - name: Build
        run: yarn build

      # `azure/server.js` resolves its document root as `__dirname/browser`, so the
      # server goes at the ZIP ROOT and the bundle underneath it. Staged in a directory
      # rather than zipped with `-j`, because flattening would collapse the bundle's own
      # subdirectories.
      - name: Package
        run: |
          set -euo pipefail
          rm -rf pkg && mkdir -p pkg/browser
          cp azure/server.js pkg/server.js
          cp -r dist/eagle-public/browser/. pkg/browser/
          (cd pkg && zip -qr ../preview.zip .)
          ls -lh preview.zip

      # `az webapp deploy --type zip` REPLACES the package — it does not merge into it.
      # This is measured, not theorised: on 2026-08-10 a zip holding only `server.js`
      # removed the entire Angular bundle and every request 404'd for about ten minutes.
      # There is no partial deploy here, so refuse to ship a package that is missing
      # either half.
      - name: Verify the package holds both halves
        run: |
          set -euo pipefail
          for p in server.js browser/index.html browser/env.js; do
            unzip -l preview.zip | grep -q " $p\$" \
              || { echo "::error::preview.zip is missing $p — this deploy would take the site down"; exit 1; }
          done
          unzip -p preview.zip browser/env.js | grep -qF 'eagle-search-api-test.azurewebsites.net/api' \
            || { echo "::error::the bundled env.js is not the Azure one"; exit 1; }
          echo "package complete"

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        run: |
          az webapp deploy -g ${{ vars.AZURE_RESOURCE_GROUP }} -n eagle-public-preview-test \
            --src-path preview.zip --type zip

      # Two requests, and between them they prove the deploy AND the gate:
      #
      #   /health must be 200 — it is exempt from basic auth so the platform probe does
      #   not take the app out of rotation, and it is served by `server.js`, so a 200
      #   means the package unpacked and the process booted.
      #
      #   / with no credentials must be 401. A 200 here means the deployment lost
      #   BASIC_AUTH_USER / BASIC_AUTH_PASSWORD — App Service `appSettings` is a full
      #   replace, and `server.js` treats absent credentials as "no gate" — so the
      #   preview would be open to anyone who knows the hostname, with nothing in the
      #   deploy output saying so. Fail loudly.
      #
      # No credentials are needed for either check, so none are held by this workflow.
      - name: Smoke test
        run: |
          set -uo pipefail
          host=https://eagle-public-preview-test.azurewebsites.net
          for i in $(seq 1 20); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$host/health")" = "200" ] && break
            echo "attempt $i: /health not ready yet"; sleep 15
          done
          health=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$host/health")
          [ "$health" = "200" ] || { echo "::error::/health returned $health, expected 200"; exit 1; }

          root=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$host/")
          [ "$root" = "401" ] || { echo "::error::/ returned $root, expected 401 — THE PREVIEW IS UNGATED"; exit 1; }

          curl -s -I --max-time 15 "$host/" | grep -qi '^www-authenticate: *Basic' \
            || { echo "::error::401 without a WWW-Authenticate: Basic header — browsers will not prompt"; exit 1; }
          echo "healthy and gated"

      - name: Report failure to job summary
        if: failure()
        run: |
          echo "### ❌ Azure preview deploy failed" >> $GITHUB_STEP_SUMMARY
          echo "If \`/\` returned 200 rather than 401, the basic-auth app settings are gone and the site is public." >> $GITHUB_STEP_SUMMARY
          echo "Re-apply them from \`eagle-search/azure/modules/public-web-app.bicep\` before anything else." >> $GITHUB_STEP_SUMMARY
