name: Deploy to Prod

on:
  workflow_dispatch:

permissions: write-all

env:
  OPENSHIFT_NAMESPACE_TOOLS: 6cdc9e-tools
  OPENSHIFT_NAMESPACE_PROD: 6cdc9e-prod
  IMAGE_NAME: eagle-public
  APP_NAME: eagle-public

jobs:
  deploy:
    name: Deploy to Prod
    runs-on: ubuntu-latest
    steps:
      - name: Install OpenShift CLI
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: "4.14"

      - name: Log into OpenShift
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: ${{ secrets.OPENSHIFT_URL }}
          openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
          namespace: ${{ env.OPENSHIFT_NAMESPACE_TOOLS }}

      - name: Tag image for prod
        run: |
          echo "Tagging test as prod..."
          oc -n ${{ env.OPENSHIFT_NAMESPACE_TOOLS }} tag \
            ${{ env.IMAGE_NAME }}:test ${{ env.IMAGE_NAME }}:prod

      # PROD uses DeploymentConfig which auto-triggers on image tag change
      - name: Verify deployment
        run: |
          echo "Waiting for DeploymentConfig rollout to complete..."
          oc rollout status dc/${{ env.APP_NAME }} -n ${{ env.OPENSHIFT_NAMESPACE_PROD }} --timeout=5m
          
          echo "Deployment successful!"
          oc get pods -n ${{ env.OPENSHIFT_NAMESPACE_PROD }} -l deploymentconfig=${{ env.APP_NAME }}
