nodeLinker: node-modules

# @digitalspace/eagle-analytics-client comes from GitHub Packages, which demands a token even for a
# public package. CI passes GH_PACKAGES_TOKEN; locally export a PAT with read:packages.
npmScopes:
  digitalspace:
    npmRegistryServer: "https://npm.pkg.github.com"
    npmAlwaysAuth: true
    npmAuthToken: "${GH_PACKAGES_TOKEN:-}"
